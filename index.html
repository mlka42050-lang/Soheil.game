<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.H.L Games</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Tahoma,sans-serif;
}

body{
background:#08111f;
color:white;
min-height:100vh;
}

button{
border:0;
border-radius:12px;
padding:14px 20px;
background:#1677ff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#login{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.loginBox{
width:100%;
max-width:380px;
background:#111d31;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 60px #000;
}

.logo{
width:80px;
height:80px;
margin:auto;
border-radius:20px;
background:linear-gradient(135deg,#00c6ff,#704cff);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
}

.loginBox h1{
margin:20px 0 10px;
}

.loginBox p{
color:#9eabc0;
margin-bottom:20px;
}

input{
width:100%;
padding:16px;
border-radius:12px;
border:1px solid #34435d;
background:#091321;
color:white;
font-size:16px;
text-align:center;
outline:none;
}

.loginBox button{
width:100%;
margin-top:15px;
}

#error{
display:none;
color:#ff7777;
margin-top:15px;
}

#app{
display:none;
}

header{
height:70px;
background:#101b2e;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #263650;
}

.logoSmall{
font-size:21px;
font-weight:bold;
}

.logoSmall span{
color:#00c6ff;
}

.logout{
background:#d83b4b;
padding:9px 15px;
}

.container{
max-width:1000px;
margin:auto;
padding:25px 15px;
}

.welcome{
text-align:center;
padding:25px;
background:#101d32;
border-radius:20px;
}

.welcome h1{
margin-bottom:10px;
}

.welcome p{
color:#9eabc0;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.game{
background:#101d32;
border:1px solid #253650;
border-radius:18px;
padding:25px;
text-align:center;
}

.icon{
font-size:50px;
}

.game h2{
margin:12px 0;
}

.game p{
color:#9eabc0;
font-size:14px;
margin-bottom:15px;
}

.game button{
width:100%;
}

#game{
display:none;
max-width:700px;
margin:auto;
padding:20px 15px;
}

.gameHeader{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.back{
background:#34435d;
}

.board{
background:#050b14;
border:2px solid #30405c;
border-radius:15px;
position:relative;
overflow:hidden;
}

#targetBoard{
height:400px;
}

.target{
width:60px;
height:60px;
border-radius:50%;
background:#00c6ff;
position:absolute;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
cursor:pointer;
}

.score{
text-align:center;
font-size:20px;
margin:15px;
}

#snakeCanvas{
display:block;
width:400px;
max-width:100%;
margin:auto;
background:#050b14;
border:2px solid #30405c;
border-radius:15px;
}

.controls{
display:flex;
justify-content:center;
gap:8px;
margin-top:15px;
}

.controls button{
width:60px;
height:55px;
padding:0;
font-size:22px;
background:#263650;
}

#dodgeBoard{
height:400px;
}

.player{
position:absolute;
width:45px;
height:45px;
bottom:15px;
background:#00c6ff;
border-radius:10px;
}

.enemy{
position:absolute;
width:40px;
height:40px;
top:-45px;
background:#ff405c;
border-radius:8px;
}

@media(max-width:500px){

#targetBoard,
#dodgeBoard{
height:330px;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

<div class="loginBox">

<div class="logo">S.H.L</div>

<h1>ورود به S.H.L</h1>

<p>فقط رمز عبور را وارد کنید</p>

<input
id="password"
type="password"
placeholder="رمز عبور">

<button onclick="login()">
ورود
</button>

<div id="error">
رمز اشتباه است
</div>

</div>

</div>


<!-- APP -->

<div id="app">

<header>

<div class="logoSmall">
S.H.L <span>GAMES</span>
</div>

<button class="logout" onclick="location.reload()">
خروج
</button>

</header>

<div class="container" id="menu">

<div class="welcome">

<h1>🎮 بازی‌های S.H.L</h1>

<p>یک بازی را انتخاب کن</p>

</div>


<div class="games">

<div class="game">

<div class="icon">🎯</div>

<h2>هدف</h2>

<p>
در 20 ثانیه تا می‌توانی هدف را بزن.
</p>

<button onclick="startTarget()">
شروع بازی
</button>

</div>


<div class="game">

<div class="icon">🐍</div>

<h2>مار</h2>

<p>
غذا را بخور و بزرگ‌تر شو.
</p>

<button onclick="startSnake()">
شروع بازی
</button>

</div>


<div class="game">

<div class="icon">🧱</div>

<h2>فرار</h2>

<p>
از موانع قرمز فرار کن.
</p>

<button onclick="startDodge()">
شروع بازی
</button>

</div>

</div>

</div>


<!-- GAME AREA -->

<div id="game">

<div class="gameHeader">

<h2 id="gameTitle"></h2>

<button class="back" onclick="backMenu()">
بازگشت
</button>

</div>


<!-- TARGET -->

<div id="targetGame">

<div class="score">
زمان:
<span id="targetTime">20</span>
&nbsp;&nbsp;
امتیاز:
<span id="targetScore">0</span>
</div>

<div id="targetBoard" class="board">

<div id="target" class="target" onclick="hitTarget()">
🎯
</div>

</div>

</div>


<!-- SNAKE -->

<div id="snakeGame" style="display:none">

<div class="score">
امتیاز:
<span id="snakeScore">0</span>
</div>

<canvas
id="snakeCanvas"
width="400"
height="400">
</canvas>

<div class="controls">

<button onclick="snakeDirection('left')">⬅️</button>

<button onclick="snakeDirection('up')">⬆️</button>

<button onclick="snakeDirection('down')">⬇️</button>

<button onclick="snakeDirection('right')">➡️</button>

</div>

</div>


<!-- DODGE -->

<div id="dodgeGame" style="display:none">

<div class="score">
امتیاز:
<span id="dodgeScore">0</span>
</div>

<div id="dodgeBoard" class="board">

<div id="player" class="player"></div>

</div>

<div class="controls">

<button onclick="movePlayer(-1)">⬅️</button>

<button onclick="movePlayer(1)">➡️</button>

</div>

</div>

</div>

</div>


<script>

/* =========================
   LOGIN
========================= */

function login(){

var password=document.getElementById("password").value;

if(password==="soheil1825s"){

document.getElementById("login").style.display="none";

document.getElementById("app").style.display="block";

}else{

document.getElementById("error").style.display="block";

}

}

document.getElementById("password").onkeydown=function(e){

if(e.key==="Enter"){
login();
}

};


/* =========================
   GENERAL
========================= */

var targetInterval=null;
var targetTime=20;
var targetScore=0;

var snakeInterval=null;

var dodgeInterval=null;
var dodgeEnemyInterval=null;
var dodgeScore=0;
var playerX=50;


function stopGames(){

clearInterval(targetInterval);

clearInterval(snakeInterval);

clearInterval(dodgeInterval);

clearInterval(dodgeEnemyInterval);

document.querySelectorAll(".enemy").forEach(function(e){
e.remove();
});

}


function backMenu(){

stopGames();

document.getElementById("game").style.display="none";

document.getElementById("menu").style.display="block";

}


/* =========================
   TARGET GAME
========================= */

function startTarget(){

stopGames();

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

document.getElementById("gameTitle").innerText="🎯 بازی هدف";

document.getElementById("targetGame").style.display="block";

document.getElementById("snakeGame").style.display="none";

document.getElementById("dodgeGame").style.display="none";

targetTime=20;
targetScore=0;

document.getElementById("targetTime").innerText=20;

document.getElementById("targetScore").innerText=0;

moveTarget();

targetInterval=setInterval(function(){

targetTime--;

document.getElementById("targetTime").innerText=targetTime;

if(targetTime<=0){

clearInterval(targetInterval);

alert("تمام شد! امتیاز شما: "+targetScore);

}

},1000);

}


function moveTarget(){

var board=document.getElementById("targetBoard");

var target=document.getElementById("target");

var maxX=board.clientWidth-60;

var maxY=board.clientHeight-60;

target.style.left=(Math.random()*maxX)+"px";

target.style.top=(Math.random()*maxY)+"px";

}


function hitTarget(){

if(targetTime<=0)return;

targetScore++;

document.getElementById("targetScore").innerText=targetScore;

moveTarget();

}


/* =========================
   SNAKE
========================= */

var snake=[];
var snakeFood={};
var snakeDX=20;
var snakeDY=0;


function startSnake(){

stopGames();

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

document.getElementById("gameTitle").innerText="🐍 بازی مار";

document.getElementById("targetGame").style.display="none";

document.getElementById("snakeGame").style.display="block";

document.getElementById("dodgeGame").style.display="none";

snake=[
{x:200,y:200},
{x:180,y:200},
{x:160,y:200}
];

snakeDX=20;
snakeDY=0;

document.getElementById("snakeScore").innerText=0;

createFood();

snakeInterval=setInterval(drawSnake,120);

}


function createFood(){

snakeFood={
x:Math.floor(Math.random()*20)*20,
y:Math.floor(Math.random()*20)*20
};

}


function drawSnake(){

var canvas=document.getElementById("snakeCanvas");

var ctx=canvas.getContext("2d");

ctx.clearRect(0,0,400,400);

var head={
x:snake[0].x+snakeDX,
y:snake[0].y+snakeDY
};

if(
head.x<0||
head.x>=400||
head.y<0||
head.y>=400
){

startSnake();

return;

}

for(var i=0;i<snake.length;i++){

if(
snake[i].x===head.x &&
snake[i].y===head.y
){

startSnake();

return;

}

}

snake.unshift(head);

if(
head.x===snakeFood.x &&
head.y===snakeFood.y
){

var score=
Number(document.getElementById("snakeScore").innerText)+1;

document.getElementById("snakeScore").innerText=score;

createFood();

}else{

snake.pop();

}


for(var j=0;j<snake.length;j++){

ctx.fillStyle=
j===0 ? "#00c6ff" : "#426cff";

ctx.fillRect(
snake[j].x+2,
snake[j].y+2,
16,
16
);

}

ctx.fillStyle="#ff405c";

ctx.fillRect(
snakeFood.x+4,
snakeFood.y+4,
12,
12
);

}


function snakeDirection(direction){

if(direction==="up"&&snakeDY===0){

snakeDX=0;
snakeDY=-20;

}

if(direction==="down"&&snakeDY===0){

snakeDX=0;
snakeDY=20;

}

if(direction==="left"&&snakeDX===0){

snakeDX=-20;
snakeDY=0;

}

if(direction==="right"&&snakeDX===0){

snakeDX=20;
snakeDY=0;

}

}


/* =========================
   DODGE GAME
========================= */

function startDodge(){

stopGames();

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

document.getElementById("gameTitle").innerText="🧱 بازی فرار";

document.getElementById("targetGame").style.display="none";

document.getElementById("snakeGame").style.display="none";

document.getElementById("dodgeGame").style.display="block";

dodgeScore=0;

playerX=50;

document.getElementById("dodgeScore").innerText=0;

document.getElementById("player").style.left="50%";

dodgeInterval=setInterval(function(){

dodgeScore++;

document.getElementById("dodgeScore").innerText=dodgeScore;

},1000);

dodgeEnemyInterval=setInterval(createEnemy,700);

}


function createEnemy(){

var board=document.getElementById("dodgeBoard");

var enemy=document.createElement("div");

enemy.className="enemy";

enemy.style.left=
(Math.random()*(board.clientWidth-40))+"px";

board.appendChild(enemy);

var y=-45;

var fall=setInterval(function(){

y+=5;

enemy.style.top=y+"px";

var player=document.getElementById("player");

var e=enemy.getBoundingClientRect();

var p=player.getBoundingClientRect();

if(
e.bottom>p.top &&
e.top<p.bottom &&
e.right>p.left &&
e.left<p.right
){

clearInterval(fall);

stopGames();

alert("باختی! امتیاز: "+dodgeScore);

startDodge();

return;

}

if(y>board.clientHeight){

clearInterval(fall);

enemy.remove();

}

},30);

}


function movePlayer(direction){

playerX+=direction*8;

if(playerX<5)playerX=5;

if(playerX>95)playerX=95;

document.getElementById("player").style.left=
playerX+"%";

}


/* کیبورد */

document.onkeydown=function(e){

if(e.key==="ArrowLeft"){

movePlayer(-1);

}

if(e.key==="ArrowRight"){

movePlayer(1);

}

if(e.key==="ArrowUp"){

snakeDirection("up");

}

if(e.key==="ArrowDown"){

snakeDirection("down");

}

};

</script>

</body>
</html>
