<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.H.L</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#080b16,#111c38,#080b16);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login{
    width:90%;
    max-width:380px;
    padding:35px 25px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:25px;
    background:linear-gradient(135deg,#00c6ff,#684cff);
    font-size:23px;
    font-weight:bold;
    box-shadow:0 10px 35px rgba(0,180,255,.3);
}

h1{
    margin-top:20px;
    font-size:26px;
}

.subtitle{
    margin-top:10px;
    margin-bottom:25px;
    color:#aab5ce;
    font-size:13px;
}

input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.25);
    color:white;
    outline:none;
    text-align:center;
    font-size:16px;
}

input::placeholder{
    color:#8994ad;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00bfff,#684cff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    display:none;
    margin-top:15px;
    color:#ff8585;
    font-size:13px;
}

#site{
    display:none;
    width:92%;
    max-width:900px;
}

.header{
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    text-align:center;
}

.header h1{
    margin:0;
}

.cards{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.card{
    padding:25px;
    border-radius:18px;
    background:rgba(255,255,255,.07);
    text-align:center;
}

.card span{
    font-size:35px;
}

.card h2{
    margin-top:12px;
    font-size:17px;
}

.logout{
    background:#e74c3c;
    max-width:180px;
}
</style>
</head>

<body>

<!-- صفحه ورود -->
<div class="login" id="loginBox">

    <div class="logo">
        S.H.L
    </div>

    <h1>ورود به سایت</h1>

    <div class="subtitle">
        برای ورود فقط رمز عبور را وارد کنید
    </div>

    <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        autocomplete="off"
    >

    <button onclick="login()">
        ورود
    </button>

    <div id="error">
        رمز عبور اشتباه است!
    </div>

</div>


<!-- محتوای سایت -->
<div id="site">

    <div class="header">

        <h1>
            🎮 به S.H.L خوش آمدید
        </h1>

        <p style="color:#aab5ce;margin-top:10px;">
            وارد سایت شدید
        </p>

    </div>


    <div class="cards">

        <div class="card">
            <span>🎮</span>
            <h2>بازی‌ها</h2>
        </div>

        <div class="card">
            <span>🔥</span>
            <h2>محبوب‌ترین‌ها</h2>
        </div>

        <div class="card">
            <span>⭐</span>
            <h2>منتخب‌ها</h2>
        </div>

    </div>


    <div style="text-align:center;margin-top:20px;">

        <button class="logout" onclick="logout()">
            خروج
        </button>

    </div>

</div>


<script>

/*
================================
رمز ورود سایت
================================
*/

const PASSWORD = "soheil1825s";


function login(){

    const enteredPassword =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if(enteredPassword === PASSWORD){

        document.getElementById("loginBox").style.display="none";

        document.getElementById("site").style.display="block";

        error.style.display="none";

    }else{

        error.style.display="block";

    }
}


/*
================================
خروج
================================
*/

function logout(){

    document.getElementById("site").style.display="none";

    document.getElementById("loginBox").style.display="block";

    document.getElementById("password").value="";

}


/*
================================
دکمه Enter
================================
*/

document.getElementById("password")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
