<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S.H.L | ورود</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle at top,#263d75,#090d18 65%);
    color:white;
}

.box{
    width:92%;
    max-width:400px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:linear-gradient(135deg,#00c6ff,#704cff);
    font-size:23px;
    font-weight:bold;
}

h1{
    margin:18px 0 8px;
}

p{
    color:#aab4ce;
    font-size:13px;
}

input{
    width:100%;
    margin-top:12px;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    outline:none;
    background:rgba(0,0,0,.25);
    color:white;
    text-align:center;
    font-size:15px;
}

button{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:13px;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    background:linear-gradient(135deg,#00bfff,#654cff);
}

.switch{
    margin-top:18px;
    color:#00c6ff;
    cursor:pointer;
    font-size:13px;
}

.message{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    font-size:13px;
}

#home{
    display:none;
    text-align:center;
}

.logout{
    background:#e74c3c;
}

</style>
</head>

<body>

<!-- ورود / ثبت نام -->
<div class="box" id="auth">

    <div class="logo">S.H.L</div>

    <h1 id="title">ورود</h1>

    <p id="description">
        برای ورود نام کاربری و رمز خودت را وارد کن
    </p>

    <input
        id="username"
        type="text"
        placeholder="نام کاربری"
        autocomplete="off"
    >

    <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="new-password"
    >

    <button onclick="submitForm()" id="mainButton">
        ورود
    </button>

    <div class="switch" onclick="changeMode()" id="switchText">
        حساب نداری؟ ثبت نام کن
    </div>

    <div class="message" id="message"></div>

</div>


<!-- صفحه بعد از ورود -->
<div class="box" id="home">

    <div class="logo">S.H.L</div>

    <h1>خوش آمدی 👋</h1>

    <p id="welcome"></p>

    <button class="logout" onclick="logout()">
        خروج
    </button>

</div>


<script>

let registerMode = false;

/* تغییر بین ورود و ثبت نام */

function changeMode(){

    registerMode = !registerMode;

    document.getElementById("message").style.display="none";

    if(registerMode){

        document.getElementById("title").innerText="ثبت نام";

        document.getElementById("description").innerText=
        "نام کاربری و رمز دلخواه خودت را بساز";

        document.getElementById("mainButton").innerText=
        "ساخت حساب";

        document.getElementById("switchText").innerText=
        "حساب داری؟ وارد شو";

    }else{

        document.getElementById("title").innerText="ورود";

        document.getElementById("description").innerText=
        "برای ورود نام کاربری و رمز خودت را وارد کن";

        document.getElementById("mainButton").innerText=
        "ورود";

        document.getElementById("switchText").innerText=
        "حساب نداری؟ ثبت نام کن";
    }
}


/* ثبت نام یا ورود */

function submitForm(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if(username === "" || password === ""){

        showMessage("لطفاً هر دو قسمت را وارد کن");

        return;
    }

    if(registerMode){

        /*
        ذخیره حساب روی همین مرورگر
        */

        localStorage.setItem(
            "user_" + username,
            password
        );

        showMessage("حساب با موفقیت ساخته شد");

        setTimeout(function(){

            registerMode=false;

            changeMode();

        },1000);

    }else{

        const savedPassword =
            localStorage.getItem("user_" + username);

        if(savedPassword === null){

            showMessage("این نام کاربری وجود ندارد");

            return;
        }

        if(savedPassword !== password){

            showMessage("رمز عبور اشتباه است");

            return;
        }

        login(username);
    }
}


/* ورود موفق */

function login(username){

    document.getElementById("auth").style.display="none";

    document.getElementById("home").style.display="block";

    document.getElementById("welcome").innerText=
    "کاربر " + username + "، با موفقیت وارد شدی.";
}


/* خروج */

function logout(){

    document.getElementById("home").style.display="none";

    document.getElementById("auth").style.display="block";

    document.getElementById("username").value="";

    document.getElementById("password").value="";
}


/* پیام */

function showMessage(text){

    const message =
        document.getElementById("message");

    message.innerText=text;

    message.style.display="block";
}

</script>

</body>
</html>
